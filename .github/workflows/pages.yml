name: Publicar web (Pages)

# Despliegue MODERNO de GitHub Pages como workflow normal de Actions:
# visible, re-lanzable y SIN la cola "legacy" que se atascaba con
# deployments zombie (incidentes del 2 y 4 de julio de 2026).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez, PERO SIN CANCELAR el que ya esta corriendo.
#
# OJO (bug del 6-ago-2026): antes esto tenia cancel-in-progress: true. Cuando
# llegaban dos disparos casi a la vez -el push del motor y el "auto-rescate"
# que el propio motor lanzaba 2 minutos despues- el segundo CANCELABA al
# primero, y como el primero ya habia creado el deployment en Pages, el segundo
# moria con "Deployment cancelled". Resultado: ninguno terminaba y la web se
# quedaba sin actualizar. Es justo lo contrario de lo que se buscaba.
# GitHub recomienda false para Pages precisamente por esto: los despliegues se
# ENCOLAN y el ultimo gana, en vez de matarse entre ellos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # SOLO SE PUBLICA LA WEB (30-ago-2026). El deploy subia `path: .`, es decir
      # TODO el repositorio, y con el se colaban paginas que son de trabajo:
      #   /test/       la web PRO de pruebas
      #   /lab-test/   los bocetos de la tarjeta del LAB
      #   preview*     los mockups de diseno
      # Estaban accesibles para cualquiera que adivinara la URL. No es un
      # problema de peso —entre las tres no llegan a 100 KB— sino de que son
      # borradores publicos: cosas a medio hacer con la marca encima.
      # Se borran del CHECKOUT, no del repositorio: siguen versionadas y se
      # pueden abrir en local, simplemente dejan de publicarse.
      - name: Quitar del despliegue lo que no es la web
        run: |
          rm -rf test lab-test
          rm -f preview*.html
          echo "Publicando:"; ls -1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
